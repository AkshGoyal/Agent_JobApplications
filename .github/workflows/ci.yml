name: CI

# Runs the offline test suite on every push and pull request.
# The LLM client is mocked in tests, so this needs no API key and makes no
# Gemini calls — it is free and safe to run on every commit.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
